[package]
name = "ai-brain-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ai-brain"
path = "src/main.rs"

[dependencies]
brain-core = { path = "../brain-core" }
brain-bus = { path = "../brain-bus" }
brain-sensory = { path = "../brain-sensory" }
brain-master = { path = "../brain-master" }
brain-memory = { path = "../brain-memory" }
brain-reasoning = { path = "../brain-reasoning" }
brain-motor = { path = "../brain-motor" }
brain-validation = { path = "../brain-validation" }
brain-evaluation = { path = "../brain-evaluation" }
brain-eval = { path = "../brain-eval" }
brain-llm = { path = "../brain-llm" }
brain-evolution = { path = "../brain-evolution" }
brain-evolver = { path = "../brain-evolver" }
brain-hooks = { path = "../brain-hooks" }
brain-dispatch = { path = "../brain-dispatch" }

tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-std", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
tui-textarea = "0.7"
unicode-width = "0.2"
brain-main = { path = "../brain-main" }
tools = { path = "../tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
thiserror = "2"
brain-plugin = { path = "../brain-plugin" }
brain-mcp = { path = "../brain-mcp" }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
brain-graph = { path = "../brain-graph" }
tempfile = "3"

[lints]
workspace = true
